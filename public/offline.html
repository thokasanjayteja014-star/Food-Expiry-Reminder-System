<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Food Expiry Reminder</title>
    <style>
      body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f8fbff; color: #142b4d; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; }
      main { max-width: 360px; text-align: center; background: #fff; border: 1px solid #d5e5f7; border-radius: 16px; padding: 28px; }
      h1 { font-size: 20px; margin: 12px 0 8px; }
      p { color: #58708f; line-height: 1.5; }
      button { margin-top: 12px; min-height: 44px; padding: 0 20px; border: 0; border-radius: 12px; background: #2457c5; color: #fff; font-weight: 600; font-size: 15px; }
      @media (prefers-color-scheme: dark) { body { background: #0b1626; color: #e8f0fb; } main { background: #101f35; border-color: #243b5c; } p { color: #9fb3cf; } }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" width="64" height="64" alt="" />
      <h1>You are offline</h1>
      <p>You are offline. Some features may be unavailable. Pages you opened before may still work.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
